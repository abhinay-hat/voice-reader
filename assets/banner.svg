<text x="88" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" textLength="1020.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#e6edf3" font-weight="400">⏺ </tspan><tspan fill="#e6edf3" font-weight="400">Fixed it. Each session now keeps its own audio, and nothing is generated twice.</tspan></text>
<text x="88" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" textLength="919.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8b949e" font-weight="400">  The section buttons reuse the cached audio, so playback starts at once.</tspan></text>
