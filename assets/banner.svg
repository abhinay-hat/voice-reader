.d1{animation-delay:0s}.d2{animation-delay:2s}.d3{animation-delay:4s}.d4{animation-delay:6s}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.w,.s,.cur{animation:none}.s.d2{opacity:1}}
</style></defs>
