<text x="74" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#e6edf3">Claude Code, read aloud.</text>
<text x="74" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">A natural voice that runs on your machine. Summary or the full reply, any section, any time.</text>
