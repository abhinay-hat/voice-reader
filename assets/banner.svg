<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="voice-reader: Claude Code replies read aloud, with a bar to pick summary or full, pause, replay and jump to a section">
<defs><style>.on{opacity:0;animation:on 12s infinite}@keyframes on{0%,24.50%{opacity:1}25.00%,100%{opacity:0}}.prog{transform-box:fill-box;transform-origin:left;animation:prog 3.0s linear infinite}@keyframes prog{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:center;animation:wv .9s ease-in-out infinite alternate}@keyframes wv{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}.cur{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.on,.prog,.bar,.cur{animation:none}.on.k1{opacity:1}}.k1{animation-delay:0.00s}.k2{animation-delay:3.00s}.k3{animation-delay:6.00s}.k4{animation-delay:9.00s}</style></defs>
